name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: engine
          args: --timeout=5m
      - name: Tests with race detector
        run: go test ./... -count=1 -timeout 10m -race
      - name: Coverage
        run: go test ./... -count=1 -timeout 10m -covermode=atomic -coverprofile=coverage.out
      - name: Fuzz key and hash validation
        run: |
          go test ./internal/keys -fuzz=FuzzValidateKey -fuzztime=10s
          go test ./internal/keys -fuzz=FuzzValidateHash -fuzztime=10s
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Build node binary
        working-directory: engine
        run: |
          New-Item -ItemType Directory -Force -Path ../app/resources/bin | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags '-s -w' -o ../app/resources/bin/vault-node.exe ./cmd/vault-node
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Vault-Setup
          path: app/dist/Vault-Setup.exe
